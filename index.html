<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Diario di Ferro - Beta 2.8</title>
  
  <!-- PWA Headers -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1e1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DiarioFerro">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #ff9800;
      --accent2: #26c6da;
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --border: #333333;
      --success: #4caf50;
      --danger: #f44336;
      --info: #2196f3;

      /* Colori per categoria muscolare (badge, bordi esercizio, chip attivi) */
      --cat-petto: #ff9800;
      --cat-spalle: #ffc107;
      --cat-dorso: #4caf50;
      --cat-bicipiti: #2196f3;
      --cat-tricipiti: #9c27b0;
      --cat-gambe: #f44336;
      --cat-core: #00bcd4;
      --cat-cardio: #e91e63;
      --cat-default: #ff9800;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding-bottom: 70px;
    }

    header {
      background-color: var(--card-bg);
      padding: 10px 15px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 600px;
    }

    header h1 {
      font-size: 1.1rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Timer in Header */
    .timer-container {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      background: #181818;
      padding: 6px 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
      width: 100%;
      max-width: 340px;
    }

    .timer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .timer-preset {
      flex: 1;
      min-width: 38px;
      text-align: center;
    }

    /* Barra di recupero 3D che si svuota */
    .timer-bar-wrap {
      width: 100%;
      height: 12px;
      background: #0a0a0a;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.7), inset 0 -1px 0 rgba(255,255,255,0.05);
      border: 1px solid #000;
      position: relative;
    }

    .timer-bar-wrap::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.25), rgba(255,255,255,0));
      pointer-events: none;
    }

    .timer-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 8px 0 0 8px;
      background: var(--accent2);
      transition: width 1s linear, background-color 1s linear;
    }


    .timer-display {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent);
      min-width: 55px;
      text-align: center;
    }

    .timer-btn {
      background: #2a2a2a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .timer-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: bold;
    }

    .container {
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Navigation Bar */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--card-bg);
      display: flex;
      justify-content: space-around;
      border-top: 1px solid var(--border);
      z-index: 90;
    }

    nav button {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 12px 0;
      flex-grow: 1;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    nav button.active {
      color: var(--accent);
      font-weight: bold;
    }

    /* Cards & Form Components */
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid var(--border);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: var(--accent);
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    select, input, textarea, button.btn {
      width: 100%;
      padding: 10px;
      background-color: #2a2a2a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 12px;
    }

    input[type="datetime-local"] {
      color-scheme: dark;
    }

    button.btn {
      background-color: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      margin-top: 5px;
    }

    button.btn-secondary {
      background-color: #333;
      color: #fff;
    }

    button.btn-outline {
      background-color: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    button.btn-sm {
      padding: 5px 10px;
      font-size: 0.8rem;
      width: auto;
      margin-bottom: 0;
      margin-top: 0;
    }

    button.btn-danger {
      background-color: var(--danger);
      color: #fff;
    }

    button.btn-accent2 {
      background-color: var(--accent2);
      color: #000;
    }

    /* Exercise Block */
    .exercise-block {
      background: #181818;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      border-left: 3px solid var(--accent);
    }

    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .reorder-btns {
      display: flex;
      gap: 2px;
    }

    .reorder-btns button {
      padding: 4px 6px;
      font-size: 0.75rem;
      background: #2a2a2a;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 4px;
      cursor: pointer;
    }

    .exercise-title-input {
      font-weight: bold;
      font-size: 0.95rem;
      color: var(--accent);
      background: #222;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 0;
      flex-grow: 1;
    }

    .set-row, .cardio-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .set-row span {
      font-size: 0.85rem;
      width: 50px;
    }

    .set-row input, .cardio-row input {
      margin-bottom: 0;
      text-align: center;
    }

    .set-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    /* History & Lists */
    .history-item, .db-ex-item {
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 10px;
      background: #181818;
      overflow: hidden;
    }

    .history-summary, .db-ex-summary {
      padding: 12px;
      cursor: pointer;
      user-select: none;
    }

    .history-summary:hover, .db-ex-summary:hover {
      background: #222;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .history-actions {
      display: flex;
      gap: 12px;
    }

    .history-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-title {
      font-weight: bold;
      color: var(--accent);
      font-size: 1rem;
    }

    .toggle-icon {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .history-details, .db-ex-details {
      display: none;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: #141414;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .history-item.open .history-details, .db-ex-item.open .db-ex-details {
      display: block;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .search-box {
      margin-bottom: 15px;
    }

    /* Modali e Full-Screen Overlay */
    .fullscreen-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-color);
      z-index: 1000;
      flex-direction: column;
      padding: 15px;
      overflow-y: auto;
    }

    .fullscreen-modal.active {
      display: flex;
    }

    /* Il picker esercizi può essere aperto sopra altre modali (es. Gestisci Schede):
       deve restare sempre in primo piano */
    #picker-modal {
      z-index: 99999 !important;
      position: fixed !important;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      color: var(--accent);
      font-size: 1.2rem;
    }

    .modal-close-btn {
      background: #333;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Category Chips Filter */
    .filter-chips {
      display: flex;
      flex-shrink: 0;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 2px 10px 2px;
      margin-bottom: 14px;
      scrollbar-width: none;
      position: relative;
      z-index: 1;
    }

    .filter-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: #2a2a2a;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      white-space: nowrap;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border-color: var(--accent);
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      background: #333;
      color: var(--accent);
      margin-left: 6px;
    }

    .video-link {
      display: inline-block;
      margin-top: 6px;
      color: var(--info);
      text-decoration: none;
      font-weight: bold;
    }

    .template-item {
      background: #181818;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>Diario di Ferro</h1>
      <button class="btn btn-sm btn-outline" onclick="openExerciseArchiveModal()">🗂️ Archivio Esercizi</button>
    </div>
    
    <!-- CRONOMETRO RECUPERO -->
    <div class="timer-container">
      <div class="timer-row">
        <span style="font-size: 0.8rem;">⏱️</span>
        <span class="timer-display" id="timer-display">00:00</span>
        <button class="timer-btn" id="timer-toggle-btn" onclick="toggleTimer()">Start</button>
        <button class="timer-btn" onclick="resetTimer()">Reset</button>
      </div>
      <div class="timer-bar-wrap">
        <div class="timer-bar-fill" id="timer-bar-fill"></div>
      </div>
      <div class="timer-row">
        <button class="timer-btn timer-preset" onclick="startQuickTimer(30)">30"</button>
        <button class="timer-btn timer-preset" onclick="startQuickTimer(45)">45"</button>
        <button class="timer-btn timer-preset" onclick="startQuickTimer(60)">60"</button>
        <button class="timer-btn timer-preset" onclick="startQuickTimer(90)">90"</button>
        <button class="timer-btn timer-preset" onclick="startQuickTimer(120)">120"</button>
      </div>
    </div>
  </header>

  <div class="container">
    
    <!-- SCHEDA ALLENAMENTO -->
    <section id="workout-tab" class="tab-content active">
      <div class="card">
        <h2>Seleziona Allenamento</h2>
        
        <label for="workout-date">Data e Ora Allenamento</label>
        <input type="datetime-local" id="workout-date">

        <label for="workout-select">Scegli la Scheda</label>
        <select id="workout-select" onchange="loadWorkoutTemplate()">
          <option value="">-- Seleziona Giorno --</option>
        </select>

        <p id="workout-template-date" style="font-size: 0.8rem; color: var(--text-muted); margin-top: -6px;"></p>
      </div>

      <div id="workout-form"></div>

      <div class="card" id="add-ex-card" style="display: none;">
        <button class="btn btn-accent2" onclick="openPickerForWorkout()">+ Aggiungi Esercizio dal Database</button>
      </div>

      <div class="card" id="save-card" style="display: none;">
        <label for="workout-notes">Note Allenamento</label>
        <textarea id="workout-notes" rows="3" placeholder="Sensazioni, RPE, note generali..."></textarea>
        <button class="btn" id="save-btn" onclick="saveWorkout()">Salva Allenamento</button>
        <button class="btn btn-secondary" id="cancel-edit-btn" style="display:none;" onclick="cancelEdit()">Annulla Modifica</button>
      </div>
    </section>

    <!-- STORICO -->
    <section id="history-tab" class="tab-content">
      <div class="card" id="backup-reminder-card" style="display:none; border-color: var(--accent);">
        <p id="backup-reminder-text" style="color: var(--accent); font-size: 0.9rem; margin-bottom: 10px;"></p>
        <button class="btn btn-sm btn-secondary" onclick="exportData()">Esporta ora</button>
      </div>

      <div class="card">
        <h2>Gestione Dati</h2>
        <div class="btn-group">
          <button class="btn btn-secondary" onclick="exportData()">Export JSON</button>
          <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">Import JSON</button>
        </div>
        <input type="file" id="import-file" style="display: none;" onchange="importData(event)">
        <button class="btn btn-secondary" style="margin-top: 10px;" onclick="checkStorageDebug()">🔍 Stato Memoria (Debug)</button>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h2>Storico Sessioni</h2>
          <button class="btn btn-sm btn-secondary" onclick="renderHistory()">🔄 Aggiorna</button>
        </div>

        <!-- SEARCH BAR -->
        <div class="search-box">
          <input type="text" id="history-search" placeholder="🔎 Cerca per data, scheda o esercizio..." oninput="renderHistory()">
        </div>

        <div id="history-list">
          <p style="color: var(--text-muted); text-align: center;">Nessun allenamento registrato.</p>
        </div>
      </div>
    </section>

  </div>

  <!-- NAVIGATION BAR -->
  <nav>
    <button id="nav-workout" class="active" onclick="switchTab('workout-tab')">
      <span>🏋️</span>
      <span>Allenamento</span>
    </button>
    <button id="nav-history" onclick="switchTab('history-tab')">
      <span>📜</span>
      <span>Storico</span>
    </button>
    <button id="nav-templates" onclick="openTemplateManagerModal()">
      <span>⚙️</span>
      <span>Schede</span>
    </button>
  </nav>

  <!-- MODALE FULLSCREEN: SELETTORE ESERCIZI DAL DATABASE -->
  <div id="picker-modal" class="fullscreen-modal">
    <div class="modal-header">
      <h2>Database Esercizi</h2>
      <button class="modal-close-btn" onclick="closePickerModal()">Chiudi ✖</button>
    </div>

    <input type="text" id="picker-search" placeholder="🔎 Cerca esercizio per nome..." oninput="renderPickerList()">

    <div class="filter-chips" id="picker-category-chips">
      <!-- Generato dinamicamente -->
    </div>

    <div id="picker-list" style="flex-grow: 1; min-height: 0; overflow-y: auto;">
      <!-- Lista Esercizi -->
    </div>
  </div>

  <!-- MODALE FULLSCREEN: ARCHIVIO ESERCIZI (CONSULTAZIONE E CREAZIONE) -->
  <div id="archive-modal" class="fullscreen-modal">
    <div class="modal-header">
      <h2>Archivio & Spiegazioni Esercizi</h2>
      <button class="modal-close-btn" onclick="closeExerciseArchiveModal()">Chiudi ✖</button>
    </div>

    <div class="card" style="margin-bottom: 15px;">
      <h2>Aggiungi Nuovo Esercizio Personalizzato</h2>
      <input type="text" id="new-ex-name" placeholder="Nome Esercizio (es. Panca piana)">
      <select id="new-ex-cat">
        <option value="Petto">Petto</option>
        <option value="Spalle">Spalle</option>
        <option value="Dorso">Dorso</option>
        <option value="Bicipiti">Bicipiti</option>
        <option value="Tricipiti">Tricipiti</option>
        <option value="Gambe">Gambe</option>
        <option value="Core">Core</option>
        <option value="Cardio">Cardio</option>
      </select>
      <textarea id="new-ex-desc" rows="2" placeholder="Note o spiegazione esecuzione (opzionale)"></textarea>
      <button class="btn" onclick="saveCustomExercise()">Salva nell'Archivio</button>
    </div>

    <input type="text" id="archive-search" placeholder="🔎 Cerca nell'archivio..." oninput="renderArchiveList()">
    
    <div class="filter-chips" id="archive-category-chips">
      <!-- Generato dinamicamente -->
    </div>

    <div id="archive-list" style="flex-grow: 1; min-height: 0; overflow-y: auto;">
      <!-- Lista Consultazione -->
    </div>
  </div>

  <!-- MODALE FULLSCREEN: GESTORE SCHEDE (CUSTOM WORKOUT BUILDER) -->
  <div id="template-manager-modal" class="fullscreen-modal">
    <div class="modal-header">
      <h2>Gestione Schede Personali</h2>
      <button class="modal-close-btn" onclick="closeTemplateManagerModal()">Chiudi ✖</button>
    </div>

    <div id="template-list-view">
      <button class="btn" style="margin-bottom: 15px;" onclick="openTemplateEditor(null)">+ Crea Nuova Scheda</button>
      <div id="templates-container"></div>
    </div>

    <div id="template-editor-view" style="display: none;">
      <h3 id="editor-title" style="color: var(--accent); margin-bottom: 10px;">Nuova Scheda</h3>
      <label for="editor-template-title">Titolo Scheda</label>
      <input type="text" id="editor-template-title" placeholder="Es. GIORNO A - Push">

      <label>
        <input type="checkbox" id="editor-template-is-cardio" onchange="toggleEditorCardioMode()"> Scheda di tipo CARDIO
      </label>

      <div style="margin-top: 15px; margin-bottom: 10px;">
        <h4>Esercizi in questa Scheda:</h4>
      </div>

      <div id="editor-exercises-list"></div>

      <button class="btn btn-secondary" style="margin-bottom: 15px;" onclick="openPickerForTemplateEditor()">+ Aggiungi Esercizio dal Database</button>

      <div class="btn-group">
        <button class="btn" onclick="saveTemplateFromEditor()">Salva Scheda</button>
        <button class="btn btn-secondary" onclick="closeTemplateEditor()">Annulla</button>
      </div>
    </div>
  </div>

  <script>
    /* REGISTRAZIONE SERVICE WORKER PER PWA */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrato con successo:', reg.scope))
          .catch(err => console.log('Errore registrazione Service Worker:', err));
      });
    }

    /* DATABASE DI BASE DEGLI ESERCIZI (SISTEMA) */
    const BASE_EXERCISES_DATABASE = [
      // PETTO
      { id: "ex_panca_piana", name: "Panca piana con bilanciere", category: "Petto", isCardio: false, desc: "Sdraiato su panca, adduci le scapole, impugna il bilanciere poco più largo delle spalle. Scendi al petto controllando e spingi." },
      { id: "ex_panca_inclinata_bil", name: "Panca inclinata con bilanciere", category: "Petto", isCardio: false, desc: "Panca a 30-45 gradi. Lavoro focalizzato sui fasci clavicolari (petto alto)." },
      { id: "ex_spinte_manubri_inc", name: "Spinte con manubri su panca inclinata", category: "Petto", isCardio: false, desc: "Permette un ROM maggiore rispetto al bilanciere. Mantieni le scapole addotte e depresse." },
      { id: "ex_spinte_manubri_piana", name: "Spinte con manubri su panca piana", category: "Petto", isCardio: false, desc: "Ottimo controllo e tensione costante sui pettorali." },
      { id: "ex_hex_press", name: "Squeeze/Hex press con manubri", category: "Petto", isCardio: false, desc: "Premi costantemente i due manubri l'uno contro l'altro durante tutto il movimento." },
      { id: "ex_croci_manubri", name: "Croci con manubri", category: "Petto", isCardio: false, desc: "Aperture controllate mantenendo i gomiti leggermente flessi per isolare il petto." },
      { id: "ex_croci_cavi", name: "Croci ai cavi", category: "Petto", isCardio: false, desc: "Tensione continua sia nella fase eccentrica che concentrica." },

    /* LOGICA CRONOMETRO */
    let timerInterval = null;
    let timerSeconds = 0;
    let isTimerRunning = false;
    let timerTotalSeconds = 0; // 0 = modalità cronometro (conta in su, nessuna barra)

    function playTimerAlert() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const beep = (startTime, freq) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.3, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.25);
        };
        const now = ctx.currentTime;
        beep(now, 880);
        beep(now + 0.3, 880);
      } catch (e) {}

      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200]);
      }
    }

    const TIMER_COLOR_START = [244, 67, 54];  // rosso (--danger) - inizio recupero
    const TIMER_COLOR_END = [33, 150, 243];   // blu (--info) - fine recupero

    function interpolateColor(c1, c2, t) {
      t = Math.max(0, Math.min(1, t));
      const r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
      const g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
      const b = Math.round(c1[2] + (c2[2] - c1[2]) * t);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const secs = (timerSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').innerText = `${mins}:${secs}`;

      const fillEl = document.getElementById('timer-bar-fill');
      if (timerTotalSeconds > 0) {
        const pctRemaining = Math.max(0, Math.min(100, (timerSeconds / timerTotalSeconds) * 100));
        const elapsedFraction = 1 - (pctRemaining / 100); // 0 = appena partito, 1 = tempo scaduto
        fillEl.style.width = pctRemaining + '%';
        fillEl.style.background = interpolateColor(TIMER_COLOR_START, TIMER_COLOR_END, elapsedFraction);
      } else {
        // Modalità cronometro (o reset): niente da mostrare, barra sempre azzerata esplicitamente
        fillEl.style.width = '0%';
      }
    }

    function toggleTimer() {
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        document.getElementById('timer-toggle-btn').innerText = 'Start';
      } else {
        isTimerRunning = true;
        timerTotalSeconds = 0;
        updateTimerDisplay();
        document.getElementById('timer-toggle-btn').innerText = 'Pausa';
        timerInterval = setInterval(() => {
          timerSeconds++;
          updateTimerDisplay();
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isTimerRunning = false;
      timerSeconds = 0;
      timerTotalSeconds = 0;
      updateTimerDisplay();
      document.getElementById('timer-toggle-btn').innerText = 'Start';
    }

    function startQuickTimer(seconds) {
      clearInterval(timerInterval);
      timerSeconds = seconds;
      timerTotalSeconds = seconds;
      updateTimerDisplay();
      isTimerRunning = true;
      document.getElementById('timer-toggle-btn').innerText = 'Pausa';

      timerInterval = setInterval(() => {
        if (timerSeconds > 0) {
          timerSeconds--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          isTimerRunning = false;
          timerTotalSeconds = 0;
          document.getElementById('timer-toggle-btn').innerText = 'Start';
          playTimerAlert();
        }
      }, 1000);
    }

    function saveCustomExercise() {
      const name = document.getElementById('new-ex-name').value.trim();
      const category = document.getElementById('new-ex-cat').value;
      const desc = document.getElementById('new-ex-desc').value.trim();

      if (!name) {
        alert("Inserisci il nome dell'esercizio!");
        return;
      }

      const isCardio = category === 'Cardio';
      const newEx = {
        id: 'custom_ex_' + Date.now(),
        name: name,
        category: category,
        isCardio: isCardio,
        desc: desc || 'Esercizio personalizzato.'
      };

      let customEx = JSON.parse(localStorage.getItem('custom_exercises') || '[]');
      customEx.push(newEx);
      localStorage.setItem('custom_exercises', JSON.stringify(customEx));

      document.getElementById('new-ex-name').value = '';
      document.getElementById('new-ex-desc').value = '';

      alert("✅ Esercizio aggiunto all'archivio con successo!");
      renderArchiveList();
    }

      return saved;
    }

    function populateTemplateSelect() {
      const select = document.getElementById('workout-select');
      const templates = getWorkoutTemplates();
      select.innerHTML = '<option value="">-- Seleziona Giorno --</option>';

      for (const [key, tpl] of Object.entries(templates)) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = tpl.title || key;
        select.appendChild(opt);
      }
    }

    function loadWorkoutTemplate() {
      const key = document.getElementById('workout-select').value;
      const container = document.getElementById('workout-form');
      const saveCard = document.getElementById('save-card');
      const addExCard = document.getElementById('add-ex-card');
      const dateEl = document.getElementById('workout-template-date');
      container.innerHTML = '';

      const templates = getWorkoutTemplates();

      if (!key || !templates[key]) {
        saveCard.style.display = 'none';
        addExCard.style.display = 'none';
        activeWorkoutData = null;
        editingWorkoutId = null;
        document.getElementById('save-btn').innerText = 'Salva Allenamento';
        if (dateEl) dateEl.innerText = '';
        return;
      }

      if (!editingWorkoutId) {
        activeWorkoutData = JSON.parse(JSON.stringify(templates[key]));
      }

      if (dateEl) dateEl.innerText = formatTemplateDate(templates[key].createdAt);

      renderExerciseBlocks();

      saveCard.style.display = 'block';
      addExCard.style.display = 'block';
    }

    function syncCurrentFormToData() {
      if (!activeWorkoutData || !Array.isArray(activeWorkoutData.exercises)) return;

      activeWorkoutData.exercises.forEach((ex, exIdx) => {
        const titleInput = document.getElementById(`ex-title-${exIdx}`);
        if (titleInput) ex.name = titleInput.value;

        if (activeWorkoutData.isCardio) {
          ex.time = document.getElementById(`ex-${exIdx}-time`)?.value || '';
          ex.dist = document.getElementById(`ex-${exIdx}-dist`)?.value || '';
          ex.speed = document.getElementById(`ex-${exIdx}-speed`)?.value || '';
        } else {
          if (Array.isArray(ex.setsData)) {
            ex.setsData.forEach((s, sIdx) => {
              s.kg = document.getElementById(`ex-${exIdx}-set-${sIdx + 1}-kg`)?.value || '';
              s.reps = document.getElementById(`ex-${exIdx}-set-${sIdx + 1}-reps`)?.value || '';
            });
          }
        }
      });
    }

    function moveExercise(exIdx, direction) {
      syncCurrentFormToData();
      if (!activeWorkoutData || !Array.isArray(activeWorkoutData.exercises)) return;

      const targetIdx = exIdx + direction;
      if (targetIdx < 0 || targetIdx >= activeWorkoutData.exercises.length) return;

      const temp = activeWorkoutData.exercises[exIdx];
      activeWorkoutData.exercises[exIdx] = activeWorkoutData.exercises[targetIdx];
      activeWorkoutData.exercises[targetIdx] = temp;

      renderExerciseBlocks();
    }

    function renderExerciseBlocks() {
      const container = document.getElementById('workout-form');
      container.innerHTML = '';

      if (!activeWorkoutData || !Array.isArray(activeWorkoutData.exercises)) return;

      activeWorkoutData.exercises.forEach((ex, exIdx) => {
        const block = document.createElement('div');
        block.className = 'exercise-block';
        block.id = `ex-block-${exIdx}`;

        const isFirst = exIdx === 0;
        const isLast = exIdx === activeWorkoutData.exercises.length - 1;

        const reorderBtns = `
          <div class="reorder-btns">
            <button ${isFirst ? 'disabled style="opacity:0.3;"' : ''} onclick="moveExercise(${exIdx}, -1)">▲</button>
            <button ${isLast ? 'disabled style="opacity:0.3;"' : ''} onclick="moveExercise(${exIdx}, 1)">▼</button>
          </div>
        `;

        if (activeWorkoutData.isCardio) {
          block.innerHTML = `
            <div class="exercise-header">
              ${reorderBtns}
              <input type="text" class="exercise-title-input" value="${escapeHtml(ex.name)}" id="ex-title-${exIdx}">
              <button class="btn btn-sm btn-danger" onclick="removeExercise(${exIdx})">Rimuovi</button>
            </div>
            <div class="cardio-row">
              <input type="text" placeholder="Tempo (es. 30 min)" id="ex-${exIdx}-time" value="${ex.time || ''}">
              <input type="text" placeholder="Distanza (es. 5 km)" id="ex-${exIdx}-dist" value="${ex.dist || ''}">
              <input type="text" placeholder="Velocità (es. 10 km/h)" id="ex-${exIdx}-speed" value="${ex.speed || ''}">
            </div>
          `;
        } else {
          let setsHtml = '';
          const setsList = Array.isArray(ex.setsData) ? ex.setsData : [];
          setsList.forEach((s, sIdx) => {
            const setNum = sIdx + 1;
            setsHtml += `
              <div class="set-row" id="set-row-${exIdx}-${setNum}">
                <span>Set ${setNum}</span>
                <input type="number" placeholder="Kg" id="ex-${exIdx}-set-${setNum}-kg" step="0.5" value="${s.kg || ''}">
                <input type="number" placeholder="Reps" id="ex-${exIdx}-set-${setNum}-reps" value="${s.reps || ''}">
              </div>
            `;
          });

          block.innerHTML = `
            <div class="exercise-header">
              ${reorderBtns}
              <input type="text" class="exercise-title-input" value="${escapeHtml(ex.name)}" id="ex-title-${exIdx}">
              <button class="btn btn-sm btn-danger" onclick="removeExercise(${exIdx})">Rimuovi</button>
            </div>
            <div id="sets-container-${exIdx}">
              ${setsHtml}
            </div>
            <div class="set-actions">
              <button class="btn btn-sm btn-secondary" onclick="addSet(${exIdx})">+ Aggiungi Serie</button>
              <button class="btn btn-sm btn-secondary" onclick="removeSet(${exIdx})">- Rimuovi Serie</button>
            </div>
          `;
        }

        container.appendChild(block);
      });
    }

    function addSet(exIdx) {
      syncCurrentFormToData();
      if (activeWorkoutData && activeWorkoutData.exercises[exIdx]) {
        if (!Array.isArray(activeWorkoutData.exercises[exIdx].setsData)) {
          activeWorkoutData.exercises[exIdx].setsData = [];
        }
        activeWorkoutData.exercises[exIdx].setsData.push({ kg: '', reps: '' });
        renderExerciseBlocks();
      }
    }

    function removeSet(exIdx) {
      syncCurrentFormToData();
      if (activeWorkoutData && activeWorkoutData.exercises[exIdx] && Array.isArray(activeWorkoutData.exercises[exIdx].setsData)) {
        if (activeWorkoutData.exercises[exIdx].setsData.length > 1) {
          activeWorkoutData.exercises[exIdx].setsData.pop();
          renderExerciseBlocks();
        }
      }
    }

    function removeExercise(exIdx) {
      syncCurrentFormToData();
      if (activeWorkoutData && Array.isArray(activeWorkoutData.exercises)) {
        if (confirm(`Vuoi rimuovere "${activeWorkoutData.exercises[exIdx].name}"?`)) {
          activeWorkoutData.exercises.splice(exIdx, 1);
          renderExerciseBlocks();
        }
      }
    }

    function addExerciseToActiveWorkout(exObj) {
      syncCurrentFormToData();
      if (!activeWorkoutData) return;
      if (!Array.isArray(activeWorkoutData.exercises)) activeWorkoutData.exercises = [];

      if (activeWorkoutData.isCardio) {
        activeWorkoutData.exercises.push({
          name: exObj.name,
          time: '', dist: '', speed: ''
        });
      } else {
        activeWorkoutData.exercises.push({
          name: exObj.name,
          setsData: [{ kg: '', reps: '' }, { kg: '', reps: '' }, { kg: '', reps: '' }]
        });
      }
      renderExerciseBlocks();
    }

    /* SISTEMA SELETTORE A TUTTO SCHERMO (FULLSCREEN PICKER) */
    function showPickerModal(targetMode) {
      pickerTargetMode = targetMode;
      const picker = document.getElementById('picker-modal');

      // Il picker deve stare sempre nell'ultimo livello del DOM, direttamente
      // sotto <body>, così non può essere intrappolato nello stacking context
      // della modale Gestione Schede o di altri contenitori.
      if (picker.parentElement !== document.body) {
        document.body.appendChild(picker);
      }

      picker.style.zIndex = '99999';
      picker.style.position = 'fixed';
      picker.classList.add('active');
      setupPickerCategories();
      renderPickerList();
    }

    function openPickerForWorkout() {
      showPickerModal('workout');
    }

    function openPickerForTemplateEditor() {
      showPickerModal('editor');
    }

    function closePickerModal() {
      document.getElementById('picker-modal').classList.remove('active');
      pickerTargetMode = null;
    }

    function setupPickerCategories() {
      const cats = ['Tutti', 'Petto', 'Spalle', 'Dorso', 'Bicipiti', 'Tricipiti', 'Gambe', 'Core', 'Cardio'];
      const container = document.getElementById('picker-category-chips');
      container.innerHTML = '';

      cats.forEach(c => {
        const btn = document.createElement('button');
        const isActive = currentPickerCategory === c;
        btn.className = `chip ${isActive ? 'active' : ''}`;
        btn.innerText = c;
        if (isActive && c !== 'Tutti') {
          btn.style.background = getCategoryColor(c);
          btn.style.borderColor = getCategoryColor(c);
        }
        btn.onclick = () => {
          currentPickerCategory = c;
          setupPickerCategories();
          renderPickerList();
        };
        container.appendChild(btn);
      });
    }

    function renderPickerList() {
      const listEl = document.getElementById('picker-list');
      const search = document.getElementById('picker-search').value.toLowerCase().trim();
      const allEx = getFullExerciseDatabase();

      const filtered = allEx.filter(ex => {
        const matchesCat = (currentPickerCategory === 'Tutti') || (ex.category === currentPickerCategory);
        const matchesSearch = ex.name.toLowerCase().includes(search) || ex.category.toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:20px;">Nessun esercizio trovato.</p>';
        return;
      }

      let html = '';
      filtered.forEach(ex => {
        html += `
          <div class="db-ex-item" style="padding: 12px; display: flex; justify-content: space-between; align-items: center;">
            <div>
              <div style="font-weight: bold; color: var(--accent);">${escapeHtml(ex.name)} <span class="badge" style="background:${getCategoryColor(ex.category)}; color:#000;">${ex.category}</span></div>
              <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">${escapeHtml(ex.desc || '')}</div>
            </div>
            <button class="btn btn-sm" onclick="selectExerciseFromPicker('${ex.id}')">Seleziona +</button>
          </div>
        `;
      });
      listEl.innerHTML = html;
    }

    function selectExerciseFromPicker(exId) {
      const allEx = getFullExerciseDatabase();
      const exObj = allEx.find(e => e.id === exId);
      if (!exObj) return;

      if (pickerTargetMode === 'workout') {
        addExerciseToActiveWorkout(exObj);
      } else if (pickerTargetMode === 'editor') {
        addExerciseToTemplateEditor(exObj);
      }

      closePickerModal();
    }

    function toggleEditorCardioMode() {
      const isCardio = document.getElementById('editor-template-is-cardio').checked;

    function saveTemplateFromEditor() {
      const title = document.getElementById('editor-template-title').value.trim();
      const isCardio = document.getElementById('editor-template-is-cardio').checked;

      if (!title) {
        alert("Inserisci un titolo per la scheda!");
        return;
      }

      let templates = getWorkoutTemplates();
      const key = editingTemplateKey || ('CUSTOM_' + Date.now());
      const existingCreatedAt = (editingTemplateKey && templates[key]) ? templates[key].createdAt : null;

      templates[key] = {
        title: title,
        isCardio: isCardio,
        exercises: tempEditorExercises,
        createdAt: existingCreatedAt || new Date().toISOString()
      };

      localStorage.setItem('workout_templates', JSON.stringify(templates));
      alert("✅ Scheda salvata con successo!");
      closeTemplateEditor();

        let templates = getWorkoutTemplates();
        delete templates[key];
        localStorage.setItem('workout_templates', JSON.stringify(templates));
        renderTemplateList();
      }
    }

    /* SALVATAGGIO WORKOUT NEL LOG STORICO */
    function saveWorkout() {
      try {
        const key = document.getElementById('workout-select').value;
        const customDateStr = document.getElementById('workout-date').value;

        if (!key) {
          alert("Seleziona prima una scheda allenamento!");
          return;
        }

        if (!customDateStr) {
          alert("Inserisci una data e un'ora valide!");
          return;
        }

        const templates = getWorkoutTemplates();

        if (!activeWorkoutData || !Array.isArray(activeWorkoutData.exercises)) {
          if (templates[key]) {
            activeWorkoutData = JSON.parse(JSON.stringify(templates[key]));
          } else {
            activeWorkoutData = { title: "ALLENAMENTO", isCardio: false, exercises: [] };
          }
        }

        syncCurrentFormToData();

        const parsedDate = new Date(customDateStr);
        const savedId = editingWorkoutId ? editingWorkoutId : Date.now();

        const workoutData = {
          id: savedId,
          date: parsedDate.toISOString(),
          workoutKey: key,
          title: activeWorkoutData.title || 'ALLENAMENTO',
          isCardio: !!activeWorkoutData.isCardio,
          notes: document.getElementById('workout-notes').value || '',
          exercises: []
        };

        const exList = Array.isArray(activeWorkoutData.exercises) ? activeWorkoutData.exercises : [];

        if (activeWorkoutData.isCardio) {
          exList.forEach((ex) => {
            workoutData.exercises.push({
              name: ex.name || 'Esercizio',
              time: ex.time || '-',
              dist: ex.dist || '-',
              speed: ex.speed || '-'
            });
          });
        } else {
          exList.forEach((ex) => {
            const exData = { name: ex.name || 'Esercizio', sets: [] };
            const setsList = Array.isArray(ex.setsData) ? ex.setsData : [];
            setsList.forEach(s => {
              exData.sets.push({ kg: s.kg || '-', reps: s.reps || '-' });
            });
            workoutData.exercises.push(exData);
          });
        }

        let history = [];
        const rawStorage = localStorage.getItem('workout_history');
        if (rawStorage) {
          try { history = JSON.parse(rawStorage); } catch(e) { history = []; }
        }

        if (editingWorkoutId) {
          const index = history.findIndex(item => item.id === editingWorkoutId);
          if (index !== -1) history[index] = workoutData;
          editingWorkoutId = null;
        } else {
          history.push(workoutData);
        }

        history.sort((a, b) => new Date(b.date) - new Date(a.date));
        
        localStorage.setItem('workout_history', JSON.stringify(history));

        alert(`✅ Allenamento salvato con successo!\nSessioni in memoria: ${history.length}`);

        // Reset Form
        document.getElementById('workout-select').disabled = false;
        document.getElementById('workout-select').value = '';
        document.getElementById('workout-form').innerHTML = '';
        document.getElementById('workout-notes').value = '';
        document.getElementById('save-card').style.display = 'none';
        document.getElementById('add-ex-card').style.display = 'none';
        document.getElementById('cancel-edit-btn').style.display = 'none';
        document.getElementById('save-btn').innerText = 'Salva Allenamento';
        activeWorkoutData = null;
        setDefaultDateTime();

        switchTab('history-tab');
      } catch (err) {
        alert("❌ ERRORE DURANTE IL SALVATAGGIO:\n" + err.message);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str === null || str === undefined ? '' : String(str);
      return div.innerHTML;
    }

    const CATEGORY_COLOR_MAP = {
      'Petto': 'var(--cat-petto)',
      'Spalle': 'var(--cat-spalle)',
      'Dorso': 'var(--cat-dorso)',
      'Bicipiti': 'var(--cat-bicipiti)',
      'Tricipiti': 'var(--cat-tricipiti)',
      'Gambe': 'var(--cat-gambe)',
      'Core': 'var(--cat-core)',
      'Cardio': 'var(--cat-cardio)'
    };

    function getCategoryColor(cat) {
      return CATEGORY_COLOR_MAP[cat] || 'var(--cat-default)';
    }

    function formatTemplateDate(isoString) {
      if (!isoString) return '📅 Scheda predefinita';
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return '📅 Scheda predefinita';

      const dateStr = d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const days = Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
      const daysLabel = days === 0 ? 'oggi' : (days === 1 ? 'da 1 giorno' : `da ${days} giorni`);
      return `📅 Creata il ${dateStr} (${daysLabel})`;
    }

    function renderHistory() {
      const historyList = document.getElementById('history-list');
      const searchQuery = (document.getElementById('history-search')?.value || '').toLowerCase().trim();
      let history = [];
      
      try {
        const raw = localStorage.getItem('workout_history');
        if (raw) history = JSON.parse(raw);
      } catch(e) { history = []; }

      if (!Array.isArray(history) || history.length === 0) {
        historyList.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Nessun allenamento registrato.</p>';
        return;
      }

      const filteredHistory = history.filter(item => {
        if (!searchQuery) return true;

        let dateObj = new Date(item.date);
        let dateFormatted = !isNaN(dateObj.getTime()) ? dateObj.toLocaleString('it-IT') : '';

        if (dateFormatted.toLowerCase().includes(searchQuery)) return true;
        if ((item.title || '').toLowerCase().includes(searchQuery)) return true;
        if ((item.notes || '').toLowerCase().includes(searchQuery)) return true;

        const exList = Array.isArray(item.exercises) ? item.exercises : [];
        return exList.some(ex => (ex.name || '').toLowerCase().includes(searchQuery));
      });

      if (filteredHistory.length === 0) {
        historyList.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Nessun risultato per la ricerca.</p>';
        return;
      }

      let html = '';
      filteredHistory.forEach((item) => {
        const originalIndex = history.findIndex(h => h.id === item.id);
        let dateObj = new Date(item.date);
        let dateFormatted = "Data non valida";
        
        if (!isNaN(dateObj.getTime())) {
          dateFormatted = dateObj.toLocaleString('it-IT', { 
            day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' 
          });
        }

        const exList = Array.isArray(item.exercises) ? item.exercises : [];

        let detailsHtml = '';
        if (item.isCardio) {
          exList.forEach(ex => {
            detailsHtml += `<div><strong>${escapeHtml(ex.name)}:</strong> ${escapeHtml(ex.time)} | ${escapeHtml(ex.dist)} | ${escapeHtml(ex.speed)}</div>`;
          });
        } else {
          exList.forEach(ex => {
            const setsList = Array.isArray(ex.sets) ? ex.sets : [];
            const setsStr = setsList.length > 0 ? setsList.map(s => `${escapeHtml(s.kg)}kg x ${escapeHtml(s.reps)}`).join(' | ') : 'Nessun set';
            detailsHtml += `<div><strong>${escapeHtml(ex.name)}:</strong> ${setsStr}</div>`;
          });
        }

        if (item.notes) {
          detailsHtml += `<div style="color: var(--text-muted); font-style: italic; margin-top: 6px;">Note: ${escapeHtml(item.notes)}</div>`;
        }

        html += `
          <div class="history-item" id="history-item-${item.id}">
            <div class="history-summary" onclick="toggleDetails(${item.id})">
              <div class="history-header">
                <span>${dateFormatted}</span>
                <div class="history-actions" onclick="event.stopPropagation()">
                  <button style="background:none; border:none; color:var(--accent); cursor:pointer;" onclick="editWorkout(${item.id})">Modifica</button>
                  <button style="background:none; border:none; color:var(--danger); cursor:pointer;" onclick="deleteWorkout(${originalIndex})">Elimina</button>
                </div>
              </div>
              <div class="history-title-row">
                <div class="history-title">${escapeHtml(item.title)}</div>
                <span class="toggle-icon">▼ Dettagli</span>
              </div>
            </div>

            <div class="history-details">
              ${detailsHtml}
            </div>
          </div>
        `;
      });

      historyList.innerHTML = html;
    }

    function editWorkout(id) {
      const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
      const target = history.find(item => item.id === id);

      if (!target) return;

      editingWorkoutId = id;

      switchTab('workout-tab');

      document.getElementById('workout-select').value = target.workoutKey;

      const d = new Date(target.date);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      document.getElementById('workout-date').value = d.toISOString().slice(0, 16);

      document.getElementById('workout-notes').value = target.notes || '';

      const exList = Array.isArray(target.exercises) ? target.exercises : [];

      activeWorkoutData = {
        title: target.title,
        isCardio: target.isCardio,
        exercises: exList.map(ex => {
          if (target.isCardio) {
            return { name: ex.name, time: ex.time, dist: ex.dist, speed: ex.speed };
          } else {
            const setsList = Array.isArray(ex.sets) ? ex.sets : [];
            return {
              name: ex.name,
              setsData: setsList.map(s => ({ kg: s.kg === '-' ? '' : s.kg, reps: s.reps === '-' ? '' : s.reps }))
            };
          }
        })
      };

      renderExerciseBlocks();
      document.getElementById('save-card').style.display = 'block';
      document.getElementById('add-ex-card').style.display = 'block';
      document.getElementById('save-btn').innerText = 'Aggiorna Allenamento';

      document.getElementById('workout-select').disabled = true;
      document.getElementById('cancel-edit-btn').style.display = 'block';
    }

    function cancelEdit() {
      editingWorkoutId = null;
      document.getElementById('workout-select').disabled = false;
      document.getElementById('workout-select').value = '';
      document.getElementById('workout-form').innerHTML = '';
      document.getElementById('workout-notes').value = '';
      document.getElementById('save-card').style.display = 'none';
      document.getElementById('add-ex-card').style.display = 'none';
      document.getElementById('cancel-edit-btn').style.display = 'none';
      document.getElementById('save-btn').innerText = 'Salva Allenamento';
      activeWorkoutData = null;
      switchTab('history-tab');
    }

    function deleteWorkout(index) {
      let history = JSON.parse(localStorage.getItem('workout_history') || '[]');
      const target = history[index];

      if (!target) return;

      let dateObj = new Date(target.date);
      let dateFormatted = !isNaN(dateObj.getTime()) 
        ? dateObj.toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })
        : '';

      const confirmMessage = `Sei sicuro di voler eliminare questa sessione?\n\n📌 ${target.title}\n📅 ${dateFormatted}`;

      if (confirm(confirmMessage)) {
        history.splice(index, 1);
        localStorage.setItem('workout_history', JSON.stringify(history));
        renderHistory();
      }
    }

    /* EXPORT & IMPORT INCLUSO BACKUP DI SCHEDE E CUSTOM EXERCISES */
    function exportData() {
      const exportObject = {
        history: JSON.parse(localStorage.getItem('workout_history') || '[]'),
        customExercises: JSON.parse(localStorage.getItem('custom_exercises') || '[]'),
        templates: JSON.parse(localStorage.getItem('workout_templates') || '{}')
      };

      const blob = new Blob([JSON.stringify(exportObject, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `diario_ferro_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();

      localStorage.setItem('last_export_date', new Date().toISOString());
      checkBackupReminder();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);

          if (Array.isArray(imported)) {
            // Compatibilità vecchio formato
            let currentHistory = JSON.parse(localStorage.getItem('workout_history') || '[]');
            let merged = [...imported, ...currentHistory];
            const unique = Array.from(new Map(merged.map(item => [item.id, item])).values());
            unique.sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('workout_history', JSON.stringify(unique));
          } else if (imported && typeof imported === 'object') {
            // Nuovo formato completo
            if (imported.history && Array.isArray(imported.history)) {
              let currentHistory = JSON.parse(localStorage.getItem('workout_history') || '[]');
              let merged = [...imported.history, ...currentHistory];
              const unique = Array.from(new Map(merged.map(item => [item.id, item])).values());
              unique.sort((a, b) => new Date(b.date) - new Date(a.date));
              localStorage.setItem('workout_history', JSON.stringify(unique));
            }
            if (imported.customExercises && Array.isArray(imported.customExercises)) {
              localStorage.setItem('custom_exercises', JSON.stringify(imported.customExercises));
            }
            if (imported.templates && typeof imported.templates === 'object') {
              localStorage.setItem('workout_templates', JSON.stringify(imported.templates));
            }
          }

          alert('Importazione completata con successo!');
          populateTemplateSelect();
          renderHistory();
        } catch (err) {
          alert('Errore nella lettura del file JSON.');
        }
      };
      reader.readAsText(file);
    }

    function checkBackupReminder() {
      const card = document.getElementById('backup-reminder-card');
      const text = document.getElementById('backup-reminder-text');
      if (!card || !text) return;

      const lastExportStr = localStorage.getItem('last_export_date');
      const REMINDER_DAYS = 7;

      if (!lastExportStr) {
        card.style.display = 'block';
        text.innerText = '⚠️ Non hai ancora fatto nessun export di backup. Ti consigliamo di farne uno ora.';
        return;
      }

      const lastExport = new Date(lastExportStr);
      const daysSince = Math.floor((Date.now() - lastExport.getTime()) / (1000 * 60 * 60 * 24));

      if (daysSince >= REMINDER_DAYS) {
        card.style.display = 'block';
        text.innerText = `⚠️ Sono passati ${daysSince} giorni dall'ultimo backup. Ti consigliamo di esportare i dati.`;
      } else {
        card.style.display = 'none';
      }
    }

    function checkStorageDebug() {
      const rawHistory = localStorage.getItem('workout_history') || '[]';
      const rawCustom = localStorage.getItem('custom_exercises') || '[]';
      const rawTemplates = localStorage.getItem('workout_templates') || '{}';
      
      const parsedH = JSON.parse(rawHistory);
      const parsedC = JSON.parse(rawCustom);
      const parsedT = JSON.parse(rawTemplates);

      const totalKB = ((rawHistory.length + rawCustom.length + rawTemplates.length) / 1024).toFixed(2);

      alert(`🔍 DIAGNOSTICA MEMORIA:\n\n- Dimensione dati: ${totalKB} KB\n- Sessione salvate: ${parsedH.length}\n- Esercizi personalizzati: ${parsedC.length}\n- Schede configurate: ${Object.keys(parsedT).length}`);
    }

    window.onload = function() {
      setDefaultDateTime();
      populateTemplateSelect();
      renderHistory();
      checkBackupReminder();
    };
  </script>
</body>
</html>
